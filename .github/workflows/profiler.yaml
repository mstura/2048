name: Run Profiler

on:
  push:
    branches:
      - master
  workflow_dispatch:
jobs:
  run-profiler:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Pull docker image
        run: docker pull castimaging/profiler-cli:v2

      - name: Run Profiler
        run: |
         cd ${{ github.workspace }}
          git_folder=$(basename "$(git rev-parse --show-toplevel)") 
          # The git folder name is mapped to the project name
          docker run -v $(pwd):/fastScan/sourceCode castimaging/profiler-cli:v2 /fastScan/sourceCode -s https://profiler.castsoftware.io/v2 --repo-id ${{github.repository_id}} --run-id ${{github.run_id}} --run-attempt ${{ github.run_attempt }} -n $git_folder -c profiler-github -ci -nb